name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - working-directory: go
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o ../dist/Skate3-Mods.exe .
      - shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item dist/Skate3-Mods.exe pkg/
          Copy-Item dist-extras/*.bat pkg/
          Copy-Item README.md, LICENSE pkg/
          Compress-Archive -Path pkg/* -DestinationPath Skate3-Mods.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Skate3-Mods
          path: Skate3-Mods.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Skate3-Mods.zip
